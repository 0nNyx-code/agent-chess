<!doctype html>
<html lang="en" data-board="vitrine">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<meta name="description" content="EPIC Chess — a cinematic chess stage.">
<title>EPIC Chess</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b0d10'/%3E%3Cpath d='M44 8c-8-2-15 2-19 9l-4 8-7 4c-3 2-4 6-2 9l3 5 6-2 1 10h8l-1-8 6 3 4 5h8l-3-11c5-4 8-10 7-17L49 9z' fill='%238aa2ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="ambient" aria-hidden="true"></div>
<div class="vitrine-grain" aria-hidden="true"></div>
<div class="embers" id="embers" aria-hidden="true"></div>

<!-- ------------------------------------------------------------------ intro -->
<div class="intro" id="splash" aria-hidden="true">
  <div class="intro-aura" aria-hidden="true"></div>
  <div class="intro-stage">
    <div class="intro-mark">
      <svg viewBox="55 8 400 423" role="img" aria-label="EPIC Chess">
        <use href="#epic-mark" xlink:href="#epic-mark"></use>
      </svg>
    </div>
    <div class="intro-word">
      <span class="intro-epic">EPIC</span>
      <span class="intro-chess">CHESS</span>
    </div>
    <div class="intro-rule" aria-hidden="true"></div>
    <p class="intro-tag">every move is a moment</p>
  </div>
  <div class="intro-skip">tap to enter</div>
</div>

<!-- ------------------------------------------------------------------ stage -->
<div class="stage" id="stage">

  <header class="stage-top">
    <div class="stage-brand">
      <svg class="stage-glyph" viewBox="55 8 400 423" aria-hidden="true">
        <use href="#epic-mark" xlink:href="#epic-mark"></use>
      </svg>
      <span class="stage-word">EPIC <em>CHESS</em></span>
    </div>
    <div class="stage-actions">
      <button class="glass-icon" id="btn-sound" type="button" aria-label="Toggle sound" title="Sound">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="wave" d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      </button>
      <button class="glass-icon" id="btn-settings" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.5 12H2.1M21.9 12h-2.4M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"/></svg>
      </button>
    </div>
  </header>

  <main class="stage-main" aria-label="Game">

    <div class="player-bar seat seat-top" id="opponent-bar">
      <div class="avatar" id="opponent-avatar">AI</div>
      <div class="who">
        <span class="name" id="opponent-name">Agent</span>
        <span class="sub" id="opponent-sub">Medium</span>
      </div>
      <div class="captured" id="opponent-captured" aria-hidden="true"></div>
      <div class="material" id="opponent-material"></div>
    </div>

    <div class="board-stage" id="board-stage">
      <div class="board-plinth" aria-hidden="true"></div>
      <div class="board" id="board" role="grid" aria-label="Chess board">
        <div class="squares" id="squares"></div>
        <div class="pieces" id="pieces"></div>
      </div>
      <div class="board-shine" aria-hidden="true"></div>
      <div class="speedlines" aria-hidden="true"></div>
      <div class="impact" aria-hidden="true"></div>
      <div class="pov-lens" aria-hidden="true"><span class="pov-arrow"></span></div>
      <div class="quip" id="quip" aria-live="polite"></div>
    </div>

    <div class="player-bar seat seat-bottom" id="player-bar">
      <div class="avatar human" id="player-avatar">YOU</div>
      <div class="who">
        <span class="name" id="player-name">You</span>
        <span class="sub" id="player-sub">White</span>
      </div>
      <div class="captured" id="player-captured" aria-hidden="true"></div>
      <div class="material" id="player-material"></div>
    </div>

    <div class="stage-status" aria-live="polite">
      <i class="status-dot" aria-hidden="true"></i>
      <span class="status" id="status">White to move</span>
      <span class="status-sep" aria-hidden="true">·</span>
      <span class="stage-mode"><span id="meta-mode">Play with Bot</span><span class="mode-dot" aria-hidden="true">/</span><span id="meta-level">Medium</span></span>
    </div>

  </main>

  <footer class="stage-foot">
    <button class="moves-hairline" id="stage-moves" type="button" aria-label="Open moves">
      <i aria-hidden="true"></i>
      <span>Moves</span>
      <b id="stage-moves-count">0</b>
    </button>
    <div class="transport">
      <button class="play-btn" id="stage-play" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>
        <span>Bermain</span>
      </button>
      <button class="pause-btn" id="stage-pause" type="button" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
      </button>
    </div>
  </footer>

</div>

<!-- app.js keeps these bindings; they are triggered from the glass sheets -->
<div class="legacy-bindings" hidden aria-hidden="true">
  <button id="btn-new" type="button"></button>
  <button id="btn-undo" type="button"></button>
  <button id="btn-flip" type="button"></button>
  <button id="btn-hint" type="button"></button>
  <button id="btn-auto" type="button"><span></span><svg viewBox="0 0 24 24"></svg></button>
  <span id="engine-chip"></span>
</div>

<!-- ------------------------------------------------------------------ moves -->
<div class="moves-layer" id="moves-layer">
  <div class="moves-scrim" id="moves-scrim" aria-hidden="true"></div>
  <aside class="panel collapsed" id="panel" aria-label="Move list">
    <button class="panel-handle" id="btn-panel" type="button" aria-label="Close move list" aria-expanded="false">
      <span class="handle-bar" aria-hidden="true"></span>
      <span class="handle-label">MOVES</span>
      <span class="handle-count" id="handle-count">0</span>
    </button>
    <div class="panel-body">
      <div class="panel-head">
        <h2>Moves</h2>
        <div class="panel-head-actions">
          <button class="ghost" id="btn-live" type="button" hidden>Live</button>
          <button class="ghost" id="btn-copy-pgn" type="button">PGN</button>
        </div>
      </div>
      <div class="move-list-wrap">
        <ol class="move-list" id="move-list"></ol>
        <div class="move-empty" id="move-empty">
          <span>No moves yet.</span>
          <small>The board is waiting for you.</small>
        </div>
      </div>
      <div class="panel-foot">
        <div class="eval-row">
          <span class="label">Eval</span>
          <div class="eval-bar" aria-hidden="true"><div class="eval-fill" id="eval-fill"></div><i class="eval-mid"></i></div>
          <span class="eval-num" id="eval-num">0.00</span>
        </div>
        <div class="engine-row" id="engine-row">
          <span>depth —</span><span>nodes —</span><span>time —</span>
        </div>
      </div>
    </div>
  </aside>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div class="subtitle-rail" id="subtitle-rail" aria-live="polite"></div>

<div class="boot-error" id="boot-error" hidden>
  <strong>The stage could not start.</strong>
  <span id="boot-error-msg">An unexpected error stopped the app.</span>
  <button type="button" onclick="location.reload()">Try again</button>
</div>

<script>
(function () {
  var shown = false;
  function fail(message) {
    if (shown) return;
    shown = true;
    var el = document.getElementById('boot-error');
    if (!el) return;
    el.hidden = false;
    var msg = document.getElementById('boot-error-msg');
    if (msg && message) msg.textContent = String(message);
  }
  window.addEventListener('error', function (e) { fail(e.message); });
  window.addEventListener('unhandledrejection', function (e) {
    fail(e.reason && e.reason.message ? e.reason.message : e.reason);
  });
  window.__AC_BOOT_OK = false;
  window.__AC_BOOT_DONE = function () { window.__AC_BOOT_OK = true; };
  setTimeout(function () {
    if (!window.__AC_BOOT_OK) fail('The engine did not finish loading.');
  }, 9000);
})();
</script>

<script src="js/core/constants.js"></script>
<script src="js/core/engine.js"></script>
<script src="js/ai/eval.js"></script>
<script src="js/ai/search.js"></script>
<script src="js/ui/sound.js"></script>
<script src="js/ui/fx.js"></script>
<script src="js/ui/board.js"></script>
<script src="js/ui/app.js"></script>
<script src="js/ui/stage.js"></script>
</body>
</html>
