name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch project source
        run: |
          curl -sSL --retry 5 -o /tmp/src.tar.gz https://litter.catbox.moe/ake7rj.gz
          tar -xzf /tmp/src.tar.gz -C "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/scripts/build-apk.sh"
      - name: Fetch Android SDK
        run: |
          SDK="$RUNNER_TEMP/sdk"
          mkdir -p "$SDK"
          curl -sSL --retry 5 -o /tmp/bt.zip https://dl.google.com/android/repository/build-tools_r35_linux.zip
          curl -sSL --retry 5 -o /tmp/pf.zip https://dl.google.com/android/repository/platform-35_r02.zip
          unzip -q /tmp/bt.zip -d "$SDK"
          unzip -q /tmp/pf.zip -d "$SDK"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
      - name: Generate signing key
        run: |
          mkdir -p signing
          keytool -genkeypair -keystore signing/k.jks -storepass agentchess -keypass agentchess -alias ac -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Agent Chess, O=Nolmodal, C=ID"
          keytool -exportcert -rfc -keystore signing/k.jks -storepass agentchess -alias ac -file signing/cert.pem
          openssl x509 -in signing/cert.pem -outform DER -out signing/cert.der
          keytool -importkeystore -noprompt -srckeystore signing/k.jks -srcstorepass agentchess -destkeystore signing/k.p12 -deststoretype PKCS12 -deststorepass agentchess
          openssl pkcs12 -in signing/k.p12 -nocerts -nodes -passin pass:agentchess -out signing/k.pem
          openssl pkcs8 -topk8 -nocrypt -in signing/k.pem -outform DER -out signing/key.pk8
          echo "AGENT_CHESS_KEY=$PWD/signing/key.pk8" >> "$GITHUB_ENV"
          echo "AGENT_CHESS_CERT=$PWD/signing/cert.der" >> "$GITHUB_ENV"
      - name: Build
        run: bash scripts/build-apk.sh
      - name: Verify
        run: "$ANDROID_SDK/android-15/apksigner" verify --verbose dist/agent-chess.apk
      - uses: actions/upload-artifact@v4
        with:
          name: agent-chess-apk
          path: dist/agent-chess.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Agent Chess APK ${{ github.run_number }}
          files: dist/agent-chess.apk
          body: Vitrine Glass build. Sideload on Android 7.0+.
