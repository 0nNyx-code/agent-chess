name: Build APK

# Cloud build for EPIC Chess.
#
# No Gradle, no Android Studio: the same aapt2 -> javac -> d8 -> zipalign ->
# apksigner pipeline that scripts/build-apk.sh runs locally. The workflow builds
# from the checked-out repository, so a push to main always produces an APK.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch Android build-tools + platform
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK"
          curl -sSL --retry 5 -o /tmp/bt.zip https://dl.google.com/android/repository/build-tools_r35_linux.zip
          curl -sSL --retry 5 -o /tmp/pf.zip https://dl.google.com/android/repository/platform-35_r02.zip
          unzip -q /tmp/bt.zip -d "$SDK"
          unzip -q /tmp/pf.zip -d "$SDK"
          test -x "$SDK/android-15/aapt2"
          test -f "$SDK/android-35/android.jar"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Prepare signing key
        run: |
          set -euo pipefail
          mkdir -p signing
          keytool -genkeypair -v \
            -keystore signing/keystore.jks \
            -storepass agentchess -keypass agentchess \
            -alias agentchess -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Agent Chess, OU=Dev, O=Nolmodal, L=Yogyakarta, C=ID"
          keytool -exportcert -rfc -keystore signing/keystore.jks \
            -storepass agentchess -alias agentchess -file signing/cert.pem
          openssl x509 -in signing/cert.pem -outform DER -out signing/cert.der
          keytool -importkeystore -noprompt \
            -srckeystore signing/keystore.jks -srcstorepass agentchess \
            -destkeystore signing/key.p12 -deststoretype PKCS12 -deststorepass agentchess
          openssl pkcs12 -in signing/key.p12 -nocerts -nodes \
            -passin pass:agentchess -out signing/key.pem
          openssl pkcs8 -topk8 -nocrypt -in signing/key.pem -outform DER -out signing/key.pk8
          ls -l signing

      - name: Build
        run: |
          set -euo pipefail
          export AGENT_CHESS_KEY="$PWD/signing/key.pk8"
          export AGENT_CHESS_CERT="$PWD/signing/cert.der"
          export VERSION_NAME="1.1"
          bash scripts/build-apk.sh

      - name: Show result
        run: |
          ls -lh dist/
          "$ANDROID_SDK/android-15/apksigner" verify --verbose dist/agent-chess.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-chess-apk
          path: dist/agent-chess.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: EPIC Chess APK ${{ github.run_number }}
          files: |
            dist/agent-chess.apk
            dist/agent-chess.html
          body: |
            EPIC Chess — Vitrine Glass build.

            Cinematic chess stage with a hand-coded engine. Sideload
            `agent-chess.apk` on Android 7.0+.
          draft: false
